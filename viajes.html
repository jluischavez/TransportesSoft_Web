<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viajes.css">
    <title>TransportesSoft — Viajes</title>
    
</head>
<body>

    <!-- NAV -->
    <nav id="navbar">
        <div id="navUsuario"></div>
        <button id="btnLogout" class="btn-back">✕ Cerrar sesión</button>
    </nav>

    <div class="container">

        <div class="page-header">
            <div class="page-title">
                Transportes<span>Soft</span>
            </div>
            <a href="index.html" class="btn-back">← Inicio</a>
        </div>

        <div class="viajes-layout">

            <!-- TABLA -->
            <div class="tabla-panel">
                <div class="tabla-header">
                    <h2>Viajes</h2>
                    <span class="tabla-count" id="contadorViajes">Cargando...</span>
                </div>
                <div class="tabla-wrapper">
                    <div class="loading" id="loadingTabla">Consultando registros...</div>
                    <table id="tablaViajes" style="display:none">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ID Transporte</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Factura</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="bodyViajes"></tbody>
                    </table>
                    <div class="empty-state" id="emptyState" style="display:none">
                        Sin registros. Crea el primer viaje →
                    </div>
                </div>
            </div>

            <!-- FORM -->
            <div class="form-panel">

                <div class="form-id-row">
                    <span class="form-id-label">ID</span>
                    <span class="form-id-value" id="displayId">—</span>
                    <span class="form-mode nuevo" id="modoLabel">NUEVO</span>
                </div>

                <div class="form-group form-row-2">
                    <div>
                        <label class="form-label">Fecha Viaje</label>
                        <input type="date" id="fechaViaje">
                    </div>
                    <div>
                        <label class="form-label">Fecha Factura</label>
                        <input type="date" id="fechaFactura">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Cliente</label>
                    <select id="selectCliente">
                        <option value="">— Selecciona cliente —</option>
                    </select>
                </div>

                <div class="form-group form-row-2">
                    <div>
                        <label class="form-label">Folio Factura</label>
                        <input type="text" id="folioFactura" placeholder="Folio único">
                    </div>
                    <div>
                        <label class="form-label">No. Transporte</label>
                        <input type="text" id="numTransporte" placeholder="Único">
                    </div>
                </div>

                <div class="form-group form-row-2">
                    <div>
                        <label class="form-label">Origen</label>
                        <select id="selectOrigen">
                            <option value="">— Origen —</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Destino</label>
                        <select id="selectDestino">
                            <option value="">— Destino —</option>
                        </select>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="form-group">
                    <label class="form-label">Operador</label>
                    <select id="selectOperador">
                        <option value="">— Selecciona operador —</option>
                    </select>
                </div>

                <div class="unidad-info" id="unidadInfo">
                    <span class="unidad-info-text" id="unidadInfoText"></span>
                </div>

                <div class="divider"></div>

                <div class="form-group costos-grid">
                    <div>
                        <label class="form-label">Monto</label>
                        <input type="text" id="monto" placeholder="0.00">
                    </div>
                    <div>
                        <label class="form-label">IVA (16%)</label>
                        <input type="text" id="iva" placeholder="0.00">
                    </div>
                    <div>
                        <label class="form-label">Retenciones (4%)</label>
                        <input type="text" id="retenciones" placeholder="0.00">
                    </div>
                    <div>
                        <label class="form-label">Maniobra</label>
                        <input type="text" id="maniobra" placeholder="0.00">
                    </div>
                </div>

                <div class="total-row">
                    <span class="total-label">Total</span>
                    <span class="total-value" id="totalDisplay">$0.00</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Comentarios</label>
                    <textarea id="comentarios" placeholder="Observaciones opcionales..."></textarea>
                </div>

                <div class="msg-error" id="msgError"></div>

                <button class="btn-guardar" id="btnGuardar">✓ Guardar viaje</button>
                <button class="btn-eliminar" id="btnEliminar">✕ Eliminar viaje</button>
                <button class="btn-nuevo" id="btnNuevo">+ Nuevo</button>

            </div>
        </div>
    </div>


<script src="JS/viajes.js"></script>
</body>
</html>
