<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/catalogos.css">
    <title>TransportesSoft — Contabilidad de Unidades</title>
</head>
<body>

    <!-- NAV -->
    <nav id="navbar">
        <div id="navUsuario"></div>
        <button id="btnLogout" class="btn-back">✕ Cerrar sesión</button>
    </nav>

    <div class="catalogos-wrapper">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle btn-secondary" id="sidebarToggle" title="Colapsar menú">
                <span class="toggle-icon">◀</span>
            </button>

            <div class="sidebar-logo">
                <span class="logo-text">Contabilidad de Unidades</span>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item" data-modulo="ConsumoUnidades" onclick="cargarModulo('ConsumoUnidades', this)">
                    <span class="nav-icon">🚛</span>
                    <span class="nav-text">Consumo de Unidades</span>
                </button>

                <button class="nav-item" data-modulo="KilometrajeUnidades" onclick="cargarModulo('KilometrajeUnidades', this)">
                    <span class="nav-icon">📏</span>
                    <span class="nav-text">Kilometraje de Unidades</span>
                </button>

                <button class="nav-item" data-modulo="PrecioDiesel" onclick="cargarModulo('PrecioDiesel', this)">
                    <span class="nav-icon">⛽</span>
                    <span class="nav-text">Precio del Diesel</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="nav-item">
                    <span class="nav-icon">⬅</span>
                    <span class="nav-text">Inicio</span>
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="catalogos-main contabilidad-unidades-main" id="ContabilidadUnidadesMain">

            <div class="main-header">
                <div class="main-title" id="mainTitle">Contabilidad de Unidades</div>
                <div class="main-subtitle" id="mainSubtitle">Selecciona una opción del menú lateral</div>
            </div>

            <div class="catalogo-layout contabilidad-unidades-layout" id="ContabilidadUnidadesLayout" style="display:none">

                <!-- TABLA -->
                <div class="tabla-panel">
                    <div class="tabla-header">
                        <h2 id="tablaTitle">Consumo de Unidades</h2>
                        <span class="tabla-count" id="tablaCount">Cargando...</span>
                    </div>
                    <div class="tabla-wrapper">
                        <div class="loading" id="loadingTabla">Consultando registros...</div>
                        <table id="tablaRegistros" style="display:none">
                            <thead id="tablaHead"></thead>
                            <tbody id="tablaBody"></tbody>
                        </table>
                        <div class="empty-state" id="emptyState" style="display:none">
                            Sin registros. Crea el primero →
                        </div>
                    </div>
                </div>

                <!-- FORM -->
                <div class="form-panel" id="formPanel">
                    <div class="form-id-row">
                        <span class="form-id-label">ID</span>
                        <span class="form-id-value" id="displayId">—</span>
                        <span class="form-mode nuevo" id="modoLabel">NUEVO</span>
                    </div>

                    <div id="formCampos"></div>

                    <div class="msg-error" id="msgError"></div>

                    <button class="btn-guardar" id="btnGuardar">✓ Guardar</button>
                    <button class="btn-eliminar" id="btnEliminar">✕ Eliminar</button>
                    <button class="btn-nuevo" id="btnNuevo">+ Nuevo</button>
                </div>

            </div>
        </main>
    </div>

    <script src="JS/config.js"></script>
    <script src="JS/authGuard.js"></script>
    <script src="JS/ContabilidadUnidades/contabilidadunidades.js"></script>
    <script src="JS/ContabilidadUnidades/consumoUnidades.js"></script>
    <script src="JS/ContabilidadUnidades/KilometrajeUnidades.js"></script>
    <script src="JS/ContabilidadUnidades/precioDiesel.js"></script>
</body>
</html>
